<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IB Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">IB</div>
        <h1>IB Chat</h1>
        <p>محادثات فورية — IB من 9 أرقام</p>
      </div>
      <div class="auth-tabs">
        <button class="tab active" data-tab="login">دخول</button>
        <button class="tab" data-tab="register">إنشاء حساب</button>
      </div>
      <form id="login-form" class="auth-form">
        <label>الـ IB (9 أرقام)</label>
        <input type="text" id="login-ib" placeholder="0123456789" inputmode="numeric" maxlength="9" autocomplete="username" />
        <label>كلمة السر</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
        <button type="submit" class="btn-primary">دخول</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <label>اسم الظهور</label>
        <input type="text" id="reg-name" placeholder="اسمك" />
        <label>IB (9 أرقام بالظبط)</label>
        <input type="text" id="reg-ib" placeholder="0123456789" inputmode="numeric" maxlength="9" />
        <label>كلمة السر</label>
        <input type="password" id="reg-pass" placeholder="٦ حروف على الأقل" />
        <button type="submit" class="btn-primary">إنشاء حساب</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <header class="side-head">
        <div class="me" id="me-chip" title="البروفايل">
          <div class="avatar me-av" id="me-av">أ</div>
          <div>
            <div class="me-name" id="me-name">أنت</div>
            <div class="me-ib" id="me-ib">—</div>
          </div>
        </div>
        <div class="side-actions">
          <button title="محادثة جديدة" id="btn-new">✎</button>
          <button title="مجموعة جديدة" id="btn-group">👥</button>
          <button title="المزيد" id="btn-more">⋮</button>
        </div>
      </header>
      <div class="tabs-row">
        <button class="pill active">الدردشات</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="ابحث بالاسم أو الـ IB" />
      </div>
      <div class="list" id="chat-list"></div>
    </aside>

    <main class="chat-pane" id="chat-pane">
      <div class="empty-state" id="empty-state">
        <div class="empty-logo">IB</div>
        <h2>IB Chat للويب</h2>
        <p style="font-size:13px;color:var(--muted)">اختار محادثة أو ابدأ واحدة جديدة</p>
        <div class="owner-btns" id="owner-btns">
          <a href="https://github.com" target="_blank" rel="noopener">المساعدة في الكتابة على GitHub</a>
          <a href="#" class="secondary" id="btn-second-site">الموقع الثاني (قريبًا)</a>
        </div>
      </div>

      <section class="conversation hidden" id="conversation">
        <header class="conv-head">
          <button class="back-btn" id="back-btn">➜</button>
          <div class="avatar" id="peer-av" style="cursor:pointer">?</div>
          <div class="peer-meta">
            <div class="peer-name" id="peer-name">—</div>
            <div class="peer-sub" id="peer-sub">—</div>
          </div>
          <div class="conv-actions">
            <button title="تعديل الاسم" id="btn-nickname">✎</button>
          </div>
        </header>
        <div class="messages" id="messages"></div>
        <footer class="composer">
          <button class="icon-btn" id="emoji-btn" title="إيموجي">😊</button>
          <input type="text" id="msg-input" placeholder="اكتب رسالة" autocomplete="off" />
          <button class="icon-btn" id="mic-btn" title="تسجيل صوت">🎤</button>
          <button class="send-btn" id="send-btn" title="إرسال">➤</button>
        </footer>
        <div class="emoji-panel hidden" id="emoji-panel"></div>
      </section>
    </main>
  </div>

  <!-- محادثة جديدة -->
  <div class="modal hidden" id="new-modal">
    <div class="modal-card">
      <h3>محادثة جديدة</h3>
      <p>اكتب IB الشخص (9 أرقام)</p>
      <input type="text" id="new-ib" placeholder="0123456789" inputmode="numeric" maxlength="9" />
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel-new">إلغاء</button>
        <button class="btn-primary" id="start-new">بدء</button>
      </div>
    </div>
  </div>

  <!-- مجموعة جديدة -->
  <div class="modal hidden" id="group-modal">
    <div class="modal-card">
      <h3>إنشاء مجموعة</h3>
      <label>اسم المجموعة</label>
      <input type="text" id="group-name" placeholder="اسم الجروب" />
      <label>اختار الأعضاء من الموجودين</label>
      <div id="group-contacts" style="max-height:200px;overflow:auto"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel-group">إلغاء</button>
        <button class="btn-primary" id="start-group">إنشاء</button>
      </div>
    </div>
  </div>

  <!-- البروفايل -->
  <div class="modal hidden" id="profile-modal">
    <div class="modal-card">
      <h3>البروفايل</h3>
      <div class="profile-avatar-big" id="profile-av">
        <span id="profile-av-letter">أ</span>
        <div class="edit-hint">اضغط لتغيير الصورة</div>
      </div>
      <input type="file" id="profile-file" accept="image/*" class="hidden" />
      <label>اسم الظهور</label>
      <input type="text" id="profile-name" />
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel-profile">إلغاء</button>
        <button class="btn-primary" id="save-profile">حفظ</button>
      </div>
    </div>
  </div>

  <!-- تعديل الاسم (Nickname) -->
  <div class="modal hidden" id="nick-modal">
    <div class="modal-card">
      <h3>تعديل الاسم</h3>
      <p>الاسم يظهر لك أنت بس</p>
      <input type="text" id="nick-input" placeholder="الاسم الجديد" />
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel-nick">إلغاء</button>
        <button class="btn-primary" id="save-nick">حفظ</button>
      </div>
    </div>
  </div>

  <!-- عرض صورة كبيرة -->
  <div class="modal hidden" id="photo-modal">
    <div class="modal-card" style="padding:0;overflow:hidden">
      <img id="photo-full" style="width:100%;display:block" alt="" />
      <div class="modal-actions" style="padding:12px">
        <button class="btn-ghost" id="close-photo">إغلاق</button>
      </div>
    </div>
  </div>

  <div class="dropdown hidden" id="more-menu">
    <button id="copy-ib">نسخ الـ IB بتاعي</button>
    <button id="delete-account" class="danger-item">مسح الحساب</button>
    <button id="logout">تسجيل خروج</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
